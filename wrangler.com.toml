name = "weareone-link-com-redirect"
compatibility_date = "2026-07-22"
compatibility_flags = ["nodejs_compat"]
main = "src/redirect.js"

[observability]
enabled = true

[observability.logs]
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.01

# weareone-link.com -> 301 redirect to weareone-link.org canonical equivalent.
# Preserves path + query string so deep links survive the migration.
#
# This worker has no static assets - it 301's every request. Simple and stateless.

# Custom Domain: wrangler auto-creates the DNS record AND attaches the
# redirect worker, no manual DNS setup needed.
[[routes]]
pattern = "weareone-link.com"
custom_domain = true

[[routes]]
pattern = "www.weareone-link.com"
custom_domain = true

[vars]
CANONICAL_ORIGIN = "https://weareone-link.org"
